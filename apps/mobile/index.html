<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />

    <!-- viewport-fit=cover libera as safe-areas do iPhone (notch e
         barra inferior); o CSS usa env(safe-area-inset-*).
         maximum-scale NÃO é travado: bloquear zoom prejudica quem
         precisa ampliar. O zoom automático do iOS é evitado pelo
         tamanho de fonte dos campos (16px), não por trava. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />

    <title>Relatório Comercial | Cativa</title>
    <meta
      name="description"
      content="Registro de visitas e despesas dos executivos da Cativa Operadora."
    />

    <!-- PWA -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#004b8a" />

    <!-- iOS: instalação na tela inicial -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Relatório Cativa" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <link rel="icon" type="image/png" sizes="192x192" href="/icone-192.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <div id="raiz"></div>

    <noscript>
      Este formulário precisa de JavaScript ativado para funcionar.
    </noscript>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
